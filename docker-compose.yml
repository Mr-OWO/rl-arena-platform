version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rl-arena-db
    environment:
      POSTGRES_USER: rl_user
      POSTGRES_PASSWORD: rl_password_secure
      POSTGRES_DB: rl_arena_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rl_user -d rl_arena_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rl-arena-backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://rl_user:rl_password_secure@postgres:5432/rl_arena_db
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rl-arena-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  pgdata:
